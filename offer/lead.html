<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Soundclash · נשמח לחזור אליכם</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0d0e14;--surface:#161823;--surface-2:#1d2030;--line:#2b2f43;--fg:#f2efe7;--muted:#a3a5b8;--tv:#62d9e6;--film:#f2b03a;--wa:#25d366}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.brand{font-family:Karantina,sans-serif;font-size:34px;font-weight:700;letter-spacing:.06em;direction:ltr;text-align:right;margin:0}
.brand b{color:var(--film);font-weight:700}
.bar{height:6px;border-radius:3px;display:flex;overflow:hidden;margin:10px 0 22px}
.bar i{flex:1;background:var(--tv)}.bar i+i{background:var(--film);margin-inline-start:4px}
h1{font-family:Karantina,sans-serif;font-size:48px;line-height:1;margin:0 0 8px;font-weight:700}
.lede{color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 22px}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:17px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tv);outline-offset:1px;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;min-height:54px;cursor:pointer;background:var(--wa);color:#08140c;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
button svg{width:22px;height:22px}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin:4px 0 0}
.alt{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1.6}
.alt a{color:var(--film)}
.err{color:#ff8d7a;font-size:14px;min-height:1.2em;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <p class="brand">SOUND<b>CLASH</b></p>
  <div class="bar" aria-hidden="true"><i></i><i></i></div>
  <h1>נשמח לחזור אליכם</h1>
  <p class="lede">השאירו פרטים, ונחזור עם הצעה מותאמת לאירוע שלכם, כולל הטבת ההשקה לעונת 2027.</p>

  <form id="f" novalidate>
    <label>שם מלא<input name="name" autocomplete="name" required></label>
    <div class="row">
      <label>רשות או ארגון<input name="org" autocomplete="organization" required></label>
      <label>תפקיד<input name="role" autocomplete="organization-title"></label>
    </div>
    <label>טלפון<input name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" required></label>
    <div class="row">
      <label>איזה אירוע?
        <select name="event">
          <option>מופע קיץ</option>
          <option>ט״ו באב</option>
          <option>יום העצמאות</option>
          <option>עונת היכל התרבות</option>
          <option>אירוע לעובדים</option>
          <option>אירוע משפחות</option>
          <option>אחר</option>
        </select>
      </label>
      <label>מועד משוער <small>חודש או תאריך</small><input name="when"></label>
    </div>
    <label>משהו נוסף? <small>לא חובה</small><textarea name="more"></textarea></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2Z"/></svg>שליחה</button>
    <p class="note">הפרטים נשלחים אלינו בוואטסאפ. לא נעביר אותם לאף אחד.</p>
  </form>

  <div class="alt">מעדיפים לדבר? ינון בר שירה, <a href="tel:+972546738192" dir="ltr">054-6738192</a><br>
  כל המופעים: <a href="https://soundclash.co.il">soundclash.co.il</a></div>
</main>
<script>
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target, v = function (n) { return (f.elements[n].value || "").trim(); };
  var err = document.getElementById("err");
  if (!v("name") || !v("org") || !v("phone")) { err.textContent = "נא למלא שם, רשות או ארגון, וטלפון."; return; }
  err.textContent = "";
  var lines = ["היי, השארתי פרטים בדף של Soundclash:",
    "שם: " + v("name"), "רשות או ארגון: " + v("org")];
  if (v("role")) lines.push("תפקיד: " + v("role"));
  lines.push("טלפון: " + v("phone"), "אירוע: " + v("event"));
  if (v("when")) lines.push("מועד משוער: " + v("when"));
  if (v("more")) lines.push("עוד: " + v("more"));
  location.href = "https://wa.me/972546738192?text=" + encodeURIComponent(lines.join("\n"));
});
</script>
</body>
</html>
