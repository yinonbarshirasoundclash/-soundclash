name: Migrate images from Wix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/migrate_images.py']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - run: python3 tools/migrate_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add assets/img/stage
          git diff --cached --quiet || (git commit -m "העברת תמונות הבמה מוויקס למאגר [skip ci]" && git push)
